name: Cleanup PR7 diff once

on:
  push:
    branches:
      - optimize/web-wld-abi-trim
    paths:
      - .github/workflows/cleanup-pr7-diff-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: optimize/web-wld-abi-trim
          fetch-depth: 0
      - name: Restore master formatting
        run: |
          git fetch origin master
          git checkout origin/master -- CMakeLists.txt build.ps1
      - name: Apply minimal runtime-method split
        run: python3 .github/scripts/cleanup-pr7-diff.py
      - name: Commit minimized diff
        run: |
          rm .github/scripts/cleanup-pr7-diff.py
          rm .github/workflows/cleanup-pr7-diff-once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt build.ps1 .github/scripts/cleanup-pr7-diff.py .github/workflows/cleanup-pr7-diff-once.yml
          git commit -m 'chore: minimize Web runtime-method diff'
          git push origin HEAD:optimize/web-wld-abi-trim
