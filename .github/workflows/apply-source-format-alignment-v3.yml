name: Apply source format alignment v3

on:
  push:
    branches:
      - fix/source-aligned-wld-plr-formats

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/source-aligned-wld-plr-formats
          lfs: true
          fetch-depth: 0
      - name: Make transform order-safe and apply
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_source_format_alignment.py')
          s = p.read_text()
          pairs = [
              ('plr = replace_count(plr, "v326_layout", "equipment_favorites", 5,',
               'plr = replace_count(plr, "v326_layout", "equipment_favorites", 8,'),
              ('if (!plr_version_uses_v326_layout(model_version) ||',
               'if (!plr_version_uses_equipment_favorites(model_version) ||'),
          ]
          for old, new in pairs:
              if s.count(old) != 1:
                  raise SystemExit(f'expected script fragment not found exactly once: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          python3 scripts/apply_source_format_alignment.py
      - name: Remove one-shot transformation files
        run: |
          rm -f scripts/apply_source_format_alignment.py
          rm -f .github/workflows/apply-source-format-alignment.yml
          rm -f .github/workflows/apply-source-format-alignment-v2.yml
          rm -f .github/workflows/apply-source-format-alignment-v3.yml
          rm -f .github/source-alignment-trigger
          rm -f .github/source-alignment-trigger-v2
          rm -f .github/source-alignment-trigger-v3
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: align WLD and PLR versions with Terraria source"
          git push origin HEAD:fix/source-aligned-wld-plr-formats
