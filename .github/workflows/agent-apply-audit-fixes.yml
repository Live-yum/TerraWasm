''')

          Path('tests/fuzz/fuzz_wld_open.c').write_text(r'''#include "terra_world.h"

#include <stddef.h>
#include <stdint.h>

/* Exercise the real parser entry point under ASan/UBSan and libFuzzer. */
int terra_fuzz_wld_open(const uint8_t* data, size_t size) {
    if (!data || size > UINT32_MAX) return 0;

    uint32_t handle = 0;
    terrax_world_status status = terra_world_open_from_buffer(
        data,
        (uint32_t)size,
        &handle);
    if (status == TERRAX_WORLD_STATUS_OK && handle != 0u) {
        (void)terra_world_close(handle);
    }
    return 0;
}

#ifdef LIBFUZZER
int LLVMFuzzerTestOneInput(const uint8_t* data, size_t size) {
    return terra_fuzz_wld_open(data, size);
}
#endif
''', encoding='utf-8')

          Path('tests/fuzz/fuzz_smoke.c').write_text(r'''#include <stddef.h>
#include <stdint.h>
#include <stdio.h>

int terra_fuzz_wld_open(const uint8_t* data, size_t size);
int terra_fuzz_json(const uint8_t* data, size_t size);

static void write_u16le(uint8_t* data, size_t offset, uint16_t value) {
    data[offset] = (uint8_t)value;
    data[offset + 1u] = (uint8_t)(value >> 8u);
}

static void write_u32le(uint8_t* data, size_t offset, uint32_t value) {
    data[offset] = (uint8_t)value;
    data[offset + 1u] = (uint8_t)(value >> 8u);
    data[offset + 2u] = (uint8_t)(value >> 16u);
    data[offset + 3u] = (uint8_t)(value >> 24u);
}

int main(void) {
    uint8_t seed[1024];
    for (size_t i = 0; i < sizeof(seed); ++i) seed[i] = (uint8_t)((i * 73u) ^ (i >> 2));
    if (terra_fuzz_wld_open(seed, sizeof(seed)) != 0) return 1;
    if (terra_fuzz_json(seed, sizeof(seed)) != 0) return 2;

    /* Version 88 with a valid format table and an overlong header string. */
    uint8_t overlong_header[16] = {0};
    write_u32le(overlong_header, 0u, 88u);
    write_u16le(overlong_header, 4u, 1u);
    write_u32le(overlong_header, 6u, 12u);
    write_u16le(overlong_header, 10u, 0u);
    overlong_header[12] = 0x7fu;
    if (terra_fuzz_wld_open(overlong_header, sizeof(overlong_header)) != 0) return 3;

    puts("fuzz smoke: parser and JSON harnesses completed");
    return 0;
}
''', encoding='utf-8')

          reader_test = Path('tests/test_reader_safety.js')
          reader_text = reader_test.read_text(encoding='utf-8')
          addition = r'''

test("an overlong header string is rejected without reading beyond the world buffer", async () => {
  const M = await TerraWorldWasm();
  const candidate = Buffer.alloc(16);
  candidate.writeUInt32LE(88, 0);
  candidate.writeUInt16LE(1, 4);
  candidate.writeUInt32LE(12, 6);
  candidate.writeUInt16LE(0, 10);
  candidate[12] = 0x7f;

  const inputPtr = alloc(M, candidate);
  const task = M._terra_world_open_begin(inputPtr, candidate.length);
  assert.notEqual(task, 0);
  const status = M._terra_world_open_step(task, 1);
  assert.notEqual(status, 0);
  assert.equal(M._terra_world_task_get_world_handle(task), 0);
  assert.equal(M._terra_world_task_close(task), 0);
  M._tx_free(inputPtr);
});
'''
          if 'an overlong header string is rejected' in reader_text:
              raise SystemExit('reader safety regression already exists')
          reader_test.write_text(reader_text.rstrip() + addition + '\n', encoding='utf-8')

          mem = Path('src/terra_mem.c')
          mem_text = mem.read_text(encoding='utf-8')
          unlink_marker = '''static void tx_unlink_root(TxAllocHeader* header, uint32_t domain) {
    TxAllocHeader** head = domain == TX_DOMAIN_BRIDGE ? &tx_bridge_head : &tx_native_head;
    TxAllocHeader** tail = domain == TX_DOMAIN_BRIDGE ? &tx_bridge_tail : &tx_native_tail;
    if (header->root.prev) header->root.prev->root.next = header->root.next;
    else *head = header->root.next;
    if (header->root.next) header->root.next->root.prev = header->root.prev;
    else *tail = header->root.prev;
}
'''
          release_helper = unlink_marker + '''
static void tx_release_root(TxAllocHeader* header, uint32_t domain) {
    if (!header) return;
    tx_unlink_root(header, domain);
    if (domain == TX_DOMAIN_NATIVE) tx_native_live_bytes -= header->root.size;
    else tx_bridge_live_bytes -= header->root.size;
    header->root.magic = 0;
    header->root.self = 0;
    free(header);
}
'''
          if mem_text.count(unlink_marker) != 1:
              raise SystemExit('terra_mem.c: unlink marker mismatch')
          mem_text = mem_text.replace(unlink_marker, release_helper, 1)
          old_free = '''void tx_free(uint32_t ptr) {
    void* payload = (void*)(uintptr_t)ptr;
    TxAllocHeader* header = tx_find_root(payload, TX_DOMAIN_BRIDGE);
    if (!header) return;
    tx_unlink_root(header, TX_DOMAIN_BRIDGE);
    tx_bridge_live_bytes -= header->root.size;
    header->root.magic = 0;
    header->root.self = 0;
    free(header);
}
'''
          new_free = '''void tx_free(uint32_t ptr) {
    void* payload = (void*)(uintptr_t)ptr;
    tx_release_root(tx_find_root(payload, TX_DOMAIN_BRIDGE), TX_DOMAIN_BRIDGE);
}
'''
          if mem_text.count(old_free) != 1:
              raise SystemExit('terra_mem.c: bridge free mismatch')
          mem_text = mem_text.replace(old_free, new_free, 1)
          old_internal_free = '''void tx_internal_free(void* payload) {
    TxAllocHeader* header = tx_find_root(payload, TX_DOMAIN_NATIVE);
    if (!header) return;
    tx_unlink_root(header, TX_DOMAIN_NATIVE);
    tx_native_live_bytes -= header->root.size;
    header->root.magic = 0;
    header->root.self = 0;
    free(header);
}
'''
          new_internal_free = '''void tx_internal_free(void* payload) {
    tx_release_root(tx_find_root(payload, TX_DOMAIN_NATIVE), TX_DOMAIN_NATIVE);
}
'''
          if mem_text.count(old_internal_free) != 1:
              raise SystemExit('terra_mem.c: native free mismatch')
          mem_text = mem_text.replace(old_internal_free, new_internal_free, 1)
          old_rewind = '''void tx_rewind(uint32_t mark) {
    while (tx_native_tail && tx_native_tail->root.sequence > mark)
        tx_internal_free((uint8_t*)tx_native_tail + sizeof(TxAllocHeader));
    if (!tx_native_head && mark == 0u) tx_native_sequence = 0u;
}
'''
          new_rewind = '''void tx_rewind(uint32_t mark) {
    while (tx_native_tail && tx_native_tail->root.sequence > mark) {
        TxAllocHeader* tail = tx_native_tail;
        tx_release_root(tail, TX_DOMAIN_NATIVE);
    }
    if (!tx_native_head && mark == 0u) tx_native_sequence = 0u;
}
'''
          if mem_text.count(old_rewind) != 1:
              raise SystemExit('terra_mem.c: rewind mismatch')
          mem_text = mem_text.replace(old_rewind, new_rewind, 1)

          error_pattern = re.compile(r'''void tx_set_error\(const char\* code, const char\* message\) \{.*?\n\}\n\n/\* ---------- Result helpers ---------- \*/''', re.S)
          error_replacement = r'''static int tx_error_append_raw(const char* text, uint32_t* position) {
    if (!text || !position) return 0;
    while (*text) {
        if (*position + 1u >= sizeof(tx_last_error)) return 0;
        tx_last_error[(*position)++] = *text++;
    }
    return 1;
}

static uint32_t tx_error_escape_char(unsigned char ch, char encoded[6]) {
    static const char hex[] = "0123456789abcdef";
    switch (ch) {
        case '\"': encoded[0] = '\\'; encoded[1] = '\"'; return 2u;
        case '\\': encoded[0] = '\\'; encoded[1] = '\\'; return 2u;
        case '\b': encoded[0] = '\\'; encoded[1] = 'b'; return 2u;
        case '\f': encoded[0] = '\\'; encoded[1] = 'f'; return 2u;
        case '\n': encoded[0] = '\\'; encoded[1] = 'n'; return 2u;
        case '\r': encoded[0] = '\\'; encoded[1] = 'r'; return 2u;
        case '\t': encoded[0] = '\\'; encoded[1] = 't'; return 2u;
        default:
            if (ch < 0x20u) {
                encoded[0] = '\\'; encoded[1] = 'u'; encoded[2] = '0'; encoded[3] = '0';
                encoded[4] = hex[ch >> 4u]; encoded[5] = hex[ch & 0x0fu];
                return 6u;
            }
            encoded[0] = (char)ch;
            return 1u;
    }
}

static void tx_error_append_json_text(const char* text, uint32_t* position, uint32_t reserve) {
    const unsigned char* cursor = (const unsigned char*)(text ? text : "");
    while (*cursor) {
        char encoded[6];
        uint32_t encoded_len = tx_error_escape_char(*cursor++, encoded);
        if (*position + encoded_len + reserve + 1u > sizeof(tx_last_error)) return;
        for (uint32_t i = 0; i < encoded_len; i++) tx_last_error[(*position)++] = encoded[i];
    }
}

void tx_set_error(const char* code, const char* message) {
    /* Preserve the public NOT_SUPPORTED status through operation dispatch. */
    tx_last_status = tx_streq_c(code, "TERRAX_NOT_SUPPORTED")
        ? TERRAX_WORLD_STATUS_NOT_SUPPORTED
        : -1;

    const char* prefix = "{\"code\":\"";
    const char* middle = "\",\"message\":\"";
    const char* suffix = "\"}";
    uint32_t position = 0;
    (void)tx_error_append_raw(prefix, &position);
    tx_error_append_json_text(
        code ? code : "TERRAX_WASM_ERROR",
        &position,
        tx_strlen(middle) + tx_strlen(suffix));
    (void)tx_error_append_raw(middle, &position);
    tx_error_append_json_text(message ? message : "error", &position, tx_strlen(suffix));
    (void)tx_error_append_raw(suffix, &position);
    tx_last_error[position] = 0;
}

/* ---------- Result helpers ---------- */'''
          mem_text, substitutions = error_pattern.subn(error_replacement, mem_text, count=1)
          if substitutions != 1:
              raise SystemExit(f'terra_mem.c: error serializer replacement count {substitutions}')
          mem.write_text(mem_text, encoding='utf-8')

          Path('tests/error_json_contract.c').write_text(r'''#include "terra_world.h"

#include <stdint.h>
#include <stdio.h>
#include <string.h>

extern void tx_set_error(const char* code, const char* message);

int main(void) {
    uint64_t required = 0;
    char output[256];

    tx_set_error("BAD\"CODE", "line one\nline two\t\\done");
    if (terra_info_get_last_error_json(NULL, 0u, &required) != TERRAX_WORLD_STATUS_OK) return 1;
    if (required == 0u || required > sizeof(output)) return 2;
    if (terra_info_get_last_error_json(output, sizeof(output), &required) != TERRAX_WORLD_STATUS_OK) return 3;
    if (strchr(output, '\n') || strchr(output, '\t')) return 4;
    if (!strstr(output, "BAD\\\"CODE")) return 5;
    if (!strstr(output, "line one\\nline two\\t\\\\done")) return 6;
    if (output[0] != '{' || output[strlen(output) - 1u] != '}') return 7;

    puts("error JSON contract: escaped and bounded");
    return 0;
}
''', encoding='utf-8')

          replace_once('CMakeLists.txt',
              '        add_test(NAME terra_native_contract COMMAND terra_native_contract)\n        if(TERRAWASM_FUZZ_SMOKE)\n',
              '''        add_test(NAME terra_native_contract COMMAND terra_native_contract)
