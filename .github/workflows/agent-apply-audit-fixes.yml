          PY
      - name: Configure native sanitizer contracts
        env:
          CC: clang
        run: cmake -S . -B build-agent -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTERRAWASM_NATIVE_TESTS=ON -DTERRAWASM_SANITIZERS=ON -DTERRAWASM_FUZZ_SMOKE=ON
      - name: Build and run native contracts
        run: |
          cmake --build build-agent --config RelWithDebInfo --parallel
          ctest --test-dir build-agent --build-config RelWithDebInfo --output-on-failure
      - name: Commit reviewed changes
        shell: bash
        run: |
          rm -f .github/workflows/agent-apply-audit-fixes.yml
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden malformed world parsing and native memory contracts" -m "Reject truncated length-prefixed strings before any copy, route sanitizer fuzz smoke through the real world parser, keep error JSON valid for quoted/control text, and make native rewind linear in the number of released allocations.\n\nConstraint: malformed user-supplied WLD buffers must fail with a status rather than read beyond the input.\n\nTested: clang ASan/UBSan native build; CTest parser fuzz smoke, native ABI, and error JSON contracts."
          git push origin HEAD:agent/security-runtime-hardening
