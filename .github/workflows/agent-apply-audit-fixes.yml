name: Apply audited TerraWasm hardening

on:
  push:
    branches:
      - agent/security-runtime-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/security-runtime-hardening
          fetch-depth: 0
      - name: Apply reviewed source and test changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact match, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          wld = 'src/terra_wld.c'
          replace_once(wld, '''void rd_string_copy(const uint8_t *p,uint32_t len,uint32_t *off,char *out,uint32_t cap){
    int ok=0;
    uint32_t slen=rd_7bit(p,len,off,&ok);
    if (!ok||!terra_reader_has(*off,slen,len)){
        if (cap)out[0]=0;
        *off=len;
        ;
        }
    uint32_t n=slen;
    if (n+1u>cap)n=cap?cap-1u:0u;
    for (uint32_t i=0;
    i<n;
    i++)out[i]=(char)p[*off+i];
    if (cap)out[n]=0;
    (void)terra_reader_take(off,slen,len);
    }
''', '''int rd_string_copy(const uint8_t *p,uint32_t len,uint32_t *off,char *out,uint32_t cap){
    if (!p||!off||!out||cap==0u){
        if (off)*off=len;
        return 0;
        }
    int ok=0;
    uint32_t slen=rd_7bit(p,len,off,&ok);
    if (!ok||!terra_reader_has(*off,slen,len)){
        out[0]=0;
        *off=len;
        return 0;
        }
    uint32_t n=slen;
    if (n>=cap)n=cap-1u;
    for (uint32_t i=0;
    i<n;
    i++)out[i]=(char)p[*off+i];
    out[n]=0;
    if (!terra_reader_take(off,slen,len)){
        out[0]=0;
        return 0;
        }
    return 1;
    }
''')
          replace_once(wld, '''void rd_skip_string_value(const uint8_t *p,uint32_t len,uint32_t *off){
    int ok=0;
    uint32_t slen=rd_7bit(p,len,off,&ok);
    if (!ok||!terra_reader_has(*off,slen,len)){
        *off=len;
        ;
        }
    (void)terra_reader_take(off,slen,len);
    }
''', '''int rd_skip_string_value(const uint8_t *p,uint32_t len,uint32_t *off){
    if (!p||!off)return 0;
    int ok=0;
    uint32_t slen=rd_7bit(p,len,off,&ok);
    if (!ok||!terra_reader_has(*off,slen,len)){
        *off=len;
        return 0;
        }
    return terra_reader_take(off,slen,len);
    }
''')
          replace_once(wld,
              '    /* name */rd_string_copy(p,len,&off,w->worldName,TX_MAX_NAME);\n',
              '''    /* name */if (!rd_string_copy(p,len,&off,w->worldName,TX_MAX_NAME)){
        tx_set_error("TERRAX_TRUNCATED_HEADER","world name exceeds section bounds");
        return 0;
        }
''')
          replace_once(wld,
              '            rd_string_copy(p,len,&off,w->seed,TX_MAX_NAME);\n',
              '''            if (!rd_string_copy(p,len,&off,w->seed,TX_MAX_NAME)){
                tx_set_error("TERRAX_TRUNCATED_HEADER","world seed exceeds section bounds");
                return 0;
                }
''')
          replace_once(wld, '''        for (uint32_t i=0;
        i<w->anglerFinishedSize;
        i++)rd_skip_string_value(p,len,&off);
''', '''        for (uint32_t i=0;
        i<w->anglerFinishedSize;
