name: Restore accidentally deleted test assets

on:
  push:
    branches:
      - fix/plr-real-fixtures-and-performance
    paths:
      - .github/workflows/restore-test-assets.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - name: Restore test infrastructure from last known-good commit
        run: |
          git checkout b33853c071e5c08bd72ff6da908af5f6badcca21 -- \
            tests/fixtures/corrupted/README.md \
            tests/fixtures/corrupted/pattern-4096.wld \
            tests/fixtures/native-terraria-header.wld \
            tests/fixtures/pixel-art-input.jpg \
            tests/fixtures/truncated/README.md \
            tests/fixtures/truncated/header-128.wld \
            tests/fixtures/truncated/header-16.wld \
            tests/fuzz/README.md \
            tests/fuzz/fuzz_json.c \
            tests/fuzz/fuzz_smoke.c \
            tests/fuzz/fuzz_wld_open.c \
            tests/helpers/fixtures.js
          git lfs pull --include="tests/fixtures/**"
          rm -f .github/workflows/restore-test-assets.yml
      - name: Commit restored assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: restore existing regression fixtures and fuzz harnesses"
          git push origin HEAD:fix/plr-real-fixtures-and-performance
