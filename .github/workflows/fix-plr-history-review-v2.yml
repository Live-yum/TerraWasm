name: Fix PLR history review issues v2

on:
  push:
    branches:
      - fix/plr-full-history-forward-compatible
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[plr-review-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Apply ownership and legacy item fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/terra_plr.c')
          s = p.read_text(encoding='utf-8')

          anchor = '''static int plr_root_put(PlrJsonValue *root, const char *key, PlrJsonValue *value) {
              return plr_json_object_put(root, key, value);
          }
          '''
          helper = anchor + '''
          /* plr_json_object_put consumes value on both success and failure.
           * Null the caller slot before transfer so later cleanup only frees
           * siblings that were never handed to the object. */
          static int plr_root_take(
              PlrJsonValue *root, const char *key, PlrJsonValue **value) {
              if (!value || !*value) return 0;
              PlrJsonValue *owned = *value;
              *value = NULL;
              return plr_root_put(root, key, owned);
          }
          '''
          assert s.count(anchor) == 1
          s = s.replace(anchor, helper, 1)

          old = '''static PlrJsonValue *plr_read_legacy_item(
              PlrReader *reader, int32_t version, int with_stack) {
              char *legacy_name = plr_read_string(reader);
              int32_t stack = with_stack ? plr_read_i32(reader) : 0;
              uint8_t prefix = version >= 36 ? plr_read_u8(reader) : 0u;
              if (!reader->ok || !legacy_name) { free(legacy_name); return NULL; }
              if (!with_stack) stack = legacy_name[0] ? 1 : 0;
              PlrJsonValue *item = plr_make_item(0, stack, prefix, 0);
              if (!item || !plr_json_object_put_string_owned(item, "legacyName", legacy_name)) {
                  plr_json_free(item); return NULL;
              }
              return item;
          }
          '''
          new = '''static PlrJsonValue *plr_read_legacy_item(
              PlrReader *reader, int32_t version, int with_stack) {
              char *legacy_name = plr_read_string(reader);
              int32_t stack = with_stack ? plr_read_i32(reader) : 0;
              uint8_t prefix = version >= 36 ? plr_read_u8(reader) : 0u;
              if (!reader->ok || !legacy_name) { free(legacy_name); return NULL; }
              if (!with_stack) stack = legacy_name[0] ? 1 : 0;
              PlrJsonValue *item = plr_make_item(0, stack, prefix, 0);
              if (!item) {
                  free(legacy_name);
                  return NULL;
              }
              /* put_string_owned consumes legacy_name even when insertion fails. */
              if (!plr_json_object_put_string_owned(item, "legacyName", legacy_name)) {
                  plr_json_free(item);
                  return NULL;
              }
              return item;
          }
          '''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''    char *name = plr_read_string(&reader);
              if (!name || !plr_json_object_put_string_owned(root, "name", name)) {
                  free(name); plr_json_free(root); return NULL;
              }
          '''
          new = '''    char *name = plr_read_string(&reader);
              if (!name) {
                  plr_json_free(root);
                  return NULL;
              }
              char *owned_name = name;
              name = NULL;
              /* put_string_owned consumes owned_name on both outcomes. */
              if (!plr_json_object_put_string_owned(root, "name", owned_name)) {
                  plr_json_free(root);
                  return NULL;
              }
          '''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          replacements = {
              'plr_root_put(root, "metadata", metadata)': 'plr_root_take(root, "metadata", &metadata)',
              'plr_root_put(root, colors[i], color)': 'plr_root_take(root, colors[i], &color)',
              'plr_root_put(root, "armor", armor)': 'plr_root_take(root, "armor", &armor)',
              'plr_root_put(root, "dyes", dyes)': 'plr_root_take(root, "dyes", &dyes)',
              'plr_root_put(root, "inventory", inventory)': 'plr_root_take(root, "inventory", &inventory)',
              'plr_root_put(root, "miscEquips", misc_equips)': 'plr_root_take(root, "miscEquips", &misc_equips)',
              'plr_root_put(root, "miscDyes", misc_dyes)': 'plr_root_take(root, "miscDyes", &misc_dyes)',
              'plr_root_put(root, "piggyBank", piggy)': 'plr_root_take(root, "piggyBank", &piggy)',
              'plr_root_put(root, "safe", safe)': 'plr_root_take(root, "safe", &safe)',
              'plr_root_put(root, "defendersForge", forge)': 'plr_root_take(root, "defendersForge", &forge)',
              'plr_root_put(root, "voidVault", vault)': 'plr_root_take(root, "voidVault", &vault)',
              'plr_root_put(root, "buffs", buffs)': 'plr_root_take(root, "buffs", &buffs)',
              'plr_root_put(root, "spawnPoints", spawn_points)': 'plr_root_take(root, "spawnPoints", &spawn_points)',
              'plr_root_put(root, "hideInfo", hide_info)': 'plr_root_take(root, "hideInfo", &hide_info)',
              'plr_root_put(root, "dpadRadialBindings", dpad)': 'plr_root_take(root, "dpadRadialBindings", &dpad)',
              'plr_root_put(root, "builderAccStatus", builder)': 'plr_root_take(root, "builderAccStatus", &builder)',
              'plr_root_put(root, "respawnTimer", respawn)': 'plr_root_take(root, "respawnTimer", &respawn)',
              'plr_root_put(root, "temporarySlots", temporary)': 'plr_root_take(root, "temporarySlots", &temporary)',
              'plr_root_put(root, "creativePowers", powers)': 'plr_root_take(root, "creativePowers", &powers)',
              'plr_root_put(root, "loadouts", loadouts)': 'plr_root_take(root, "loadouts", &loadouts)',
              'plr_root_put(root, "pendingRefunds", pending)': 'plr_root_take(root, "pendingRefunds", &pending)',
              'plr_root_put(root, "oneTimeDialoguesSeen", dialogues)': 'plr_root_take(root, "oneTimeDialoguesSeen", &dialogues)',
              'plr_root_put(root, "tailLayout", layout)': 'plr_root_take(root, "tailLayout", &layout)',
              'plr_root_put(loadout, "armor", a)': 'plr_root_take(loadout, "armor", &a)',
              'plr_root_put(loadout, "dyes", d)': 'plr_root_take(loadout, "dyes", &d)',
              'plr_root_put(loadout, "hide", h)': 'plr_root_take(loadout, "hide", &h)',
          }
          for old_call, new_call in replacements.items():
              count = s.count(old_call)
              assert count >= 1, (old_call, count)
              s = s.replace(old_call, new_call)

          old = '''    if (legacy && !plr_value_string(legacy, &legacy_name)) { writer->ok = 0; return; }
              if (!legacy_name) {
                  if (item_type != 0) {
                      tx_set_error("TERRAX_PLR_LEGACY_ITEM_NAME_REQUIRED",
                          "release 1-37 item edits require legacyName because the file stores item names, not ids");
                      writer->ok = 0; return;
                  }
                  legacy_name = "";
              }
              plr_writer_string(writer, legacy_name);
          '''
          new = '''    if (legacy && !plr_value_string(legacy, &legacy_name)) { writer->ok = 0; return; }
              if (item_type != 0) {
                  tx_set_error("TERRAX_PLR_LEGACY_ITEM_ID_UNREPRESENTABLE",
                      "release 1-37 stores item names; edit legacyName instead of itemType");
                  writer->ok = 0;
                  return;
              }
              if (!legacy_name) legacy_name = "";
              if (!with_stack && stack != (legacy_name[0] ? 1 : 0)) {
                  tx_set_error("TERRAX_PLR_LEGACY_ITEM_STACK_UNREPRESENTABLE",
                      "release 1-37 equipment does not store stack; it must match legacyName presence");
                  writer->ok = 0;
                  return;
              }
              if (version < 36 && prefix != 0u) {
                  tx_set_error("TERRAX_PLR_LEGACY_ITEM_PREFIX_UNREPRESENTABLE",
                      "release 1-35 does not store item prefixes");
                  writer->ok = 0;
                  return;
              }
              plr_writer_string(writer, legacy_name);
          '''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

          t = Path('tests/test_plr.js')
          ts = t.read_text(encoding='utf-8').rstrip() + '\n\n'
          test = r'''test("PLR legacy item edits reject fields that old releases cannot represent", async () => {
            const module = await TerraWorldWasm();
            const baseline = module._tx_heap_used();

            function probeSave(handle) {
              const required = module._tx_malloc(4);
              assert(required);
              try {
                return module._terra_player_save_to_buffer(handle, 0, 0, required);
              } finally {
                module._tx_free(required);
              }
            }

            const model = historicalModel(37);
            model.armor[0] = {
              itemType: 0, stack: 1, prefix: 2, favorited: false, legacyName: "Iron Pickaxe",
            };
            let handle = 0, reopened = 0;
            try {
              handle = openJson(module, model);
              reopened = openBuffer(module, encode(module, handle));
              assert.equal(getField(module, reopened, "/armor/0/legacyName"), "Iron Pickaxe");
              assert.equal(getField(module, reopened, "/armor/0/itemType"), 0);
              assert.equal(getField(module, reopened, "/armor/0/stack"), 1);
              assert.equal(getField(module, reopened, "/armor/0/prefix"), 2);

              assert.equal(setField(module, reopened, "/armor/0/itemType", 1), 0);
              assert.notEqual(probeSave(reopened), 0,
                "numeric itemType edit must not be silently ignored for release 1-37");
              assert.equal(setField(module, reopened, "/armor/0/itemType", 0), 0);
              assert.equal(setField(module, reopened, "/armor/0/stack", 0), 0);
              assert.notEqual(probeSave(reopened), 0,
                "equipment stack edit must not be silently ignored for release 1-37");
            } finally {
              if (reopened) module._terra_player_close(reopened);
              if (handle) module._terra_player_close(handle);
            }

            const v35 = historicalModel(35);
            v35.armor[0] = {
              itemType: 0, stack: 1, prefix: 1, favorited: false, legacyName: "Iron Pickaxe",
            };
            const input = allocString(module, JSON.stringify(v35));
            const output = module._tx_malloc(4);
            assert(output);
            let oldHandle = 0;
            try {
              assert.equal(module._terra_player_open_json(input, output), 0);
              oldHandle = module.HEAPU32[output >>> 2] >>> 0;
              assert(oldHandle);
              assert.notEqual(probeSave(oldHandle), 0,
                "release 1-35 prefix edit must not be silently ignored");
            } finally {
              if (oldHandle) module._terra_player_close(oldHandle);
              module._tx_free(output);
              module._tx_free(input);
            }
            assert.equal(module._tx_heap_used(), baseline);
          });
          '''
          if 'PLR legacy item edits reject fields that old releases cannot represent' not in ts:
              ts += test.strip() + '\n'
          t.write_text(ts, encoding='utf-8')
          PY
      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-plr-history-review-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden PLR history ownership and legacy edits [plr-review-fixed]"
          git push
