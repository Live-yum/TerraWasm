name: one-time WLD manifest identity fix

on:
  push:
    branches:
      - optimize/web-wld-identity-telemetry-trim

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Make manifest identity validation target-aware
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/generate-manifest.mjs')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "export const ID_EXPORTS = ['_terra_abi_version', '_terra_capabilities', '_terra_build_info_json']\n",
              "export const ID_EXPORTS = ['_terra_abi_version', '_terra_capabilities', '_terra_build_info_json']\nexport const WLD_WEB_ID_EXPORTS = ['_terra_build_info_json']\n",
              'identity constants',
          )
          replace_once(
              'function validateTarget(target, label, expectedMemory) {\n',
              'function validateTarget(target, label, expectedMemory, identityExports = ID_EXPORTS) {\n',
              'validateTarget signature',
          )
          replace_once(
              '  for (const name of ID_EXPORTS) {\n    if (!exportsList.includes(name)) fail(`${label} exports are missing ${name}`)\n  }\n',
              '  for (const name of identityExports) {\n    if (!exportsList.includes(name)) fail(`${label} exports are missing ${name}`)\n  }\n',
              'target identity loop',
          )
          replace_once(
              'function verifyWrapperIdentity(root, relativePath, label) {\n  const wrapperSource = fs.readFileSync(path.resolve(root, relativePath), \'utf8\')\n  for (const name of ID_EXPORTS) {\n',
              'function verifyWrapperIdentity(root, relativePath, label, identityExports = ID_EXPORTS) {\n  const wrapperSource = fs.readFileSync(path.resolve(root, relativePath), \'utf8\')\n  for (const name of identityExports) {\n',
              'wrapper identity signature',
          )
          replace_once(
              "  const abi = manifest.abi\n",
              "  const featureSet = normalizeFeatureSet(manifest.build?.featureSet ?? 'all')\n  const webIdentityExports = featureSet === 'wld' ? WLD_WEB_ID_EXPORTS : ID_EXPORTS\n\n  const abi = manifest.abi\n",
              'manifest feature identity setup',
          )
          replace_once(
              '  for (const name of ID_EXPORTS) {\n    if (!requiredExports.includes(name)) fail(`ABI export set is missing ${name}`)\n  }\n',
              '  for (const name of webIdentityExports) {\n    if (!requiredExports.includes(name)) fail(`ABI export set is missing ${name}`)\n  }\n',
              'ABI identity loop',
          )
          replace_once(
              "  const featureSet = normalizeFeatureSet(build.featureSet ?? 'all')\n  const buildFlags = normalizeBuildFlags(build.flags)\n",
              "  const buildFlags = normalizeBuildFlags(build.flags)\n",
              'duplicate feature set',
          )
          replace_once(
              "  const webTarget = validateTarget(manifest.targets?.web, 'Web target', {\n    initialBytes: WEB_INITIAL_MEMORY,\n    maxBytes: WEB_MAXIMUM_MEMORY,\n  })\n",
              "  const webTarget = validateTarget(manifest.targets?.web, 'Web target', {\n    initialBytes: WEB_INITIAL_MEMORY,\n    maxBytes: WEB_MAXIMUM_MEMORY,\n  }, webIdentityExports)\n",
              'web target identity validation',
          )
          replace_once(
              "  const normalizedFeatureSet = normalizeFeatureSet(featureSet)\n  const normalizedWebExports = normalizeExports(webExports, 'Web target exports')\n",
              "  const normalizedFeatureSet = normalizeFeatureSet(featureSet)\n  const webIdentityExports = normalizedFeatureSet === 'wld' ? WLD_WEB_ID_EXPORTS : ID_EXPORTS\n  const normalizedWebExports = normalizeExports(webExports, 'Web target exports')\n",
              'create manifest identity setup',
          )
          replace_once(
              "  verifyWrapperIdentity(root, webWrapper, 'Web wrapper')\n",
              "  verifyWrapperIdentity(root, webWrapper, 'Web wrapper', webIdentityExports)\n",
              'web wrapper validation',
          )

          path.write_text(text, encoding='utf-8')

          Path('tests/test_wld_web_identity_contract.js').write_text(r'''"use strict";

const assert = require("node:assert/strict");
const crypto = require("node:crypto");
const test = require("node:test");
const { pathToFileURL } = require("node:url");
const path = require("node:path");

const ROOT = path.resolve(__dirname, "..");
const sha256 = (value) => crypto.createHash("sha256").update(value).digest("hex");
const hashExports = (values) => sha256(Buffer.from(`${values.join("\n")}\n`));

function artifact(role, file) {
  return { role, path: file, bytes: 1, sha256: "a".repeat(64) };
}

test("WLD Web manifest requires build_info identity but not redundant ABI/capability exports", async () => {
  const { validateManifest } = await import(pathToFileURL(path.join(ROOT, "scripts", "generate-manifest.mjs")));
  const web = ["_terra_build_info_json", "_terra_world_open_begin"];
  const node = ["_terra_abi_version", "_terra_capabilities", "_terra_build_info_json", "_terra_world_open_from_buffer"];
  const webArtifacts = [artifact("wrapper", "build/web.js"), artifact("wasm", "build/web.wasm")];
  const manifest = {
    version: 1,
    artifactId: "terrax-world-web",
    sourceCommit: "0123456789abcdef0123456789abcdef01234567",
    dirty: false,
    abi: { version: 1, requiredExports: web, exportHash: hashExports(web) },
    memory: { initialBytes: 67108864, maxBytes: 167772160 },
    build: {
      compiler: "emscripten",
      featureSet: "wld",
      flags: {
        common: ["-O3"],
        node: ["-sENVIRONMENT=node"],
        web: ["-sENVIRONMENT=web,worker"],
      },
    },
    targets: {
      node: {
        memory: { initialBytes: 134217728, maxBytes: 536870912 },
        exports: node,
        exportHash: hashExports(node),
        artifacts: [artifact("wrapper", "build/node.js"), artifact("wasm", "build/node.wasm")],
      },
      web: {
        memory: { initialBytes: 67108864, maxBytes: 167772160 },
        exports: web,
        exportHash: hashExports(web),
        artifacts: webArtifacts,
      },
    },
    artifacts: webArtifacts,
  };

  assert.doesNotThrow(() => validateManifest(manifest));
  const missingBuildInfo = structuredClone(manifest);
  missingBuildInfo.abi.requiredExports = ["_terra_world_open_begin"];
  missingBuildInfo.abi.exportHash = hashExports(missingBuildInfo.abi.requiredExports);
  missingBuildInfo.targets.web.exports = missingBuildInfo.abi.requiredExports;
  missingBuildInfo.targets.web.exportHash = missingBuildInfo.abi.exportHash;
  assert.throws(() => validateManifest(missingBuildInfo), /missing _terra_build_info_json/);
});
''', encoding='utf-8')
      - name: Run manifest unit tests
        run: |
          node --test tests/test_manifest_contract.js tests/test_wld_web_identity_contract.js
      - name: Commit fix and remove one-time workflow
        run: |
          rm .github/workflows/zz-once-fix-wld-manifest-identity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make WLD Web manifest identity target-aware"
          git push origin HEAD:optimize/web-wld-identity-telemetry-trim
