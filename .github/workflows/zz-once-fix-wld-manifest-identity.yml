name: one-time WLD manifest identity fix

on:
  push:
    branches:
      - optimize/web-wld-identity-telemetry-trim

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Apply target-aware manifest patch
        run: python .github/scripts/fix-wld-manifest-identity.py
      - name: Validate manifest contract
        run: node --test tests/test_manifest_contract.js tests/test_wld_web_identity_contract.js
      - name: Commit patch
        run: |
          rm .github/workflows/zz-once-fix-wld-manifest-identity.yml
          rm .github/scripts/fix-wld-manifest-identity.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make WLD Web manifest identity target-aware"
          git push origin HEAD:optimize/web-wld-identity-telemetry-trim
