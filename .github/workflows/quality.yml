name: TerraWasm all profile experiment
on:
  push:
    branches: [test/all-size-profile-20261002]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install pinned Emscripten
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$env:RUNNER_TEMP/emsdk"
          & "$env:RUNNER_TEMP/emsdk/emsdk" install 5.0.7
          & "$env:RUNNER_TEMP/emsdk/emsdk" activate 5.0.7
      - name: Compare the same source and fixtures across optimization profiles
        shell: pwsh
        run: |
          $reports = @()
          foreach ($profile in @("-Os", "-Oz")) {
            Write-Host "PROFILE $profile"
            # The diagnostic Node invocation keeps the known oversize O3 control
            # measurable. Each manifest's Web size is recorded against the
            # unchanged production gate below; no production check is changed.
            & ./build.ps1 -Target node -Features all -OptimizeFlag $profile -EnableLto -Test -EmsdkDir "$env:RUNNER_TEMP/emsdk"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $manifest = Get-Content build/terra.manifest.json -Raw | ConvertFrom-Json
            $wasm = $manifest.targets.web.artifacts | Where-Object role -eq "wasm"
            $wrapper = $manifest.targets.web.artifacts | Where-Object role -eq "wrapper"
            @'
          const fs = require('fs');
          module.exports = async () => {
            const M = await require('./terrax_world_wasm_web.js')({wasmBinary: fs.readFileSync(__dirname + '/terrax_world_wasm_web.wasm')});
            process.on('exit', () => console.log('[profile-memory] ' + JSON.stringify({linearBytes:M._tx_memory_used(),heapPeakBytes:M._tx_heap_peak(),bridgePeakBytes:M._tx_bridge_heap_peak(),nativePeakBytes:M._tx_native_heap_peak()})));
            return M;
          };
          '@ | Set-Content build/profile-lowmem.cjs
            $env:TERRAWASM_LOW_MEMORY_MODULE = (Resolve-Path build/profile-lowmem.cjs).Path
            $timer = [System.Diagnostics.Stopwatch]::StartNew()
            & node tests/test_preview_png_lowmem_160.js
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $timer.Stop()
            $reports += [ordered]@{
              profile = "$profile + LTO"
              sourceCommit = $manifest.sourceCommit
              dirty = $manifest.dirty
              webWasmBytes = $wasm.bytes
              webWrapperBytes = $wrapper.bytes
              sizeGatePassed = ($wasm.bytes -le 327680 -and $wrapper.bytes -le 131072)
              fullPreviewProcessMs = [Math]::Round($timer.Elapsed.TotalMilliseconds, 1)
              maxLinearMemoryBytes = $manifest.targets.web.memory.maxBytes
            }
          }
          $reports | ConvertTo-Json -Depth 6 | Tee-Object -FilePath "$env:RUNNER_TEMP/all-profile-results.json"
          if (-not ($reports | Where-Object sizeGatePassed)) { throw "No profile meets the unchanged production size gate" }
      - name: Upload profile measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: all-profile-measurements
          path: ${{ runner.temp }}/all-profile-results.json
          if-no-files-found: warn
