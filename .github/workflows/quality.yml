name: TerraWasm quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrawasm-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes zlib1g-dev
      - name: Configure native contracts
        run: cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release -DTERRAWASM_NATIVE_TESTS=ON
      - name: Build native contracts
        run: cmake --build build-native --config Release --parallel
      - name: Run native contracts and fuzz smoke
        run: ctest --test-dir build-native --build-config Release --output-on-failure

  sanitizer-and-fuzz:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Install sanitizer dependencies
        run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev
      - name: Configure sanitizer contracts
        env:
          CC: clang
        run: cmake -S . -B build-sanitizer -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTERRAWASM_NATIVE_TESTS=ON -DTERRAWASM_SANITIZERS=ON -DTERRAWASM_FUZZ_SMOKE=ON
      - name: Build sanitizer contracts
        run: cmake --build build-sanitizer --config RelWithDebInfo --parallel
      - name: Run sanitizer contracts
        run: ctest --test-dir build-sanitizer --build-config RelWithDebInfo --output-on-failure
      - name: Run fuzz smoke explicitly
        run: ctest --test-dir build-sanitizer --build-config RelWithDebInfo --output-on-failure -R terra_fuzz_smoke

  wasm-release:
    runs-on: ubuntu-latest
    env:
      EMSCRIPTEN_VERSION: "5.0.7"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install pinned Emscripten SDK
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$env:RUNNER_TEMP/emsdk"
          & "$env:RUNNER_TEMP/emsdk/emsdk" install $env:EMSCRIPTEN_VERSION
          & "$env:RUNNER_TEMP/emsdk/emsdk" activate $env:EMSCRIPTEN_VERSION
      - name: Build and test Node and Web artifacts
        shell: pwsh
        run: ./build.ps1 -Target all -Features all -Test -EmsdkDir "$env:RUNNER_TEMP/emsdk"
      - name: Enforce manifest artifact sizes
        run: node scripts/check-artifact-size.mjs build/terra.manifest.json
      - name: Upload traceable release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: terrawasm-${{ github.sha }}
          path: |
            build/terra.manifest.json
            build/terrax_world_wasm.js
            build/terrax_world_wasm.wasm
            build/terrax_world_wasm_web.js
            build/terrax_world_wasm_web.wasm
          if-no-files-found: error

  wasm-feature-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [wld, plr]
    env:
      EMSCRIPTEN_VERSION: "5.0.7"
      TERRAWASM_FEATURE_SET: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install pinned Emscripten SDK
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$env:RUNNER_TEMP/emsdk"
          & "$env:RUNNER_TEMP/emsdk/emsdk" install $env:EMSCRIPTEN_VERSION
          & "$env:RUNNER_TEMP/emsdk/emsdk" activate $env:EMSCRIPTEN_VERSION
      - name: Build and test selected capability set
        shell: pwsh
        run: ./build.ps1 -Target all -Features $env:TERRAWASM_FEATURE_SET -Test -EmsdkDir "$env:RUNNER_TEMP/emsdk"
      - name: Build and compare viewer Web profile
        if: matrix.features == 'wld'
        shell: pwsh
        run: |
          $genericBytes = (Get-Item "build/terrax_world_wasm_web.wasm").Length
          ./build.ps1 -Target all -Features wld -ViewerWebProfile -Test -EmsdkDir "$env:RUNNER_TEMP/emsdk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $profileBytes = (Get-Item "build/terrax_world_wasm_web.wasm").Length
          & node tests/check_viewer_web_profile_artifact.js build/terrax_world_wasm_web.wasm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "generic WLD Web bytes=$genericBytes; viewer profile bytes=$profileBytes; saved=$($genericBytes - $profileBytes)"
          if ($profileBytes -ge $genericBytes) { throw "viewer Web profile did not reduce the WLD Web wasm artifact" }
      - name: Run native-size PNG under Mini Program memory ceiling
        if: matrix.features == 'wld'
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/emsdk/emsdk_env.ps1" 2>$null
          & emcmake cmake -S . -B build-lowmem `
            -DCMAKE_BUILD_TYPE=Release `
            -DTERRAWASM_FEATURE_SET=wld `
            -DTERRAX_BUILD_COMMIT=$env:GITHUB_SHA `
            -DTERRAX_BUILD_DIRTY=false `
            -DTERRAX_BUILD_COMPILER=emscripten `
            -DTERRAX_NODE_INITIAL_MEMORY=67108864 `
            -DTERRAX_NODE_MAXIMUM_MEMORY=167772160
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cmake --build build-lowmem --config Release --target terrax_world_wasm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TERRAWASM_LOW_MEMORY_MODULE = (Resolve-Path "build-lowmem/terrax_world_wasm.js").Path
          & node -e "const f=require(process.env.TERRAWASM_LOW_MEMORY_MODULE);f().then(M=>{const i=JSON.parse(M.UTF8ToString(M._terra_build_info_json()));if(i.maxMemory!==167772160)throw new Error('expected 160 MiB maxMemory, got '+i.maxMemory);console.log('maxMemory='+i.maxMemory)})"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & node tests/test_preview_png_lowmem_160.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload WLD viewer artifacts
        if: matrix.features == 'wld'
        uses: actions/upload-artifact@v7
        with:
          name: terrawasm-wld-${{ github.sha }}
          path: |
            build/terra.manifest.json
            build/terrax_world_wasm_web.js
            build/terrax_world_wasm_web.wasm
          if-no-files-found: error
