name: Viewer HELLO H5 Playwright screenshots

on:
  push:
    branches: [test/hello-h5-screenshots-20261007]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hello-h5-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: true
      VIEWER_COMMIT: bceff604da1813d100c45d0bd40170b5302e7e43
    steps:
      - name: Checkout isolated screenshot runner
        uses: actions/checkout@v7
        with:
          path: runner
          persist-credentials: false
      - name: Checkout exact viewer-app PR commit
        uses: actions/checkout@v7
        with:
          repository: Live-yan/viewer-app
          ref: bceff604da1813d100c45d0bd40170b5302e7e43
          path: viewer
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify pinned application commit
        working-directory: viewer
        run: test "$(git rev-parse HEAD)" = "$VIEWER_COMMIT"
      - name: Install application dependencies
        working-directory: viewer
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Build actual production H5
        working-directory: viewer
        run: npm run build:h5
      - name: Install real Chromium for Playwright
        env:
          BROWSER_TOOLS: ${{ runner.temp }}/hello-playwright
        run: |
          npm install --prefix "$BROWSER_TOOLS" --no-audit --no-fund playwright@1.55.0
          "$BROWSER_TOOLS/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture desktop and mobile H5 pages
        working-directory: viewer
        env:
          CIRCUIT_BROWSER_TOOLS: ${{ runner.temp }}/hello-playwright
        run: timeout --kill-after=10s 180s node --import ./scripts/node-alias-register.mjs ../runner/tests/capture_viewer_hello.mjs
      - name: Upload actual page screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hello-h5-playwright-bceff60
          path: viewer/reports/hello-h5-screenshots
          if-no-files-found: warn
          retention-days: 14
