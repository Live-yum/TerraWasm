name: Fix final PLR contracts

on:
  push:
    branches:
      - fix/plr-full-history-forward-compatible
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[plr-final-contracts]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Apply common error ABI and source-aligned test fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1. Expose the structured error query from the common ABI surface.
          h = Path('include/terra_abi.h')
          s = h.read_text(encoding='utf-8')
          old = '''#include <stdint.h>

uint32_t terra_abi_version(void);
const char* terra_capabilities(void);
const char* terra_build_info_json(void);
'''
          new = '''#include <stdint.h>
#include "terra_status.h"

uint32_t terra_abi_version(void);
const char* terra_capabilities(void);
const char* terra_build_info_json(void);

/* Common structured error query available in all/wld/plr feature builds. */
terrax_world_status terra_info_get_last_error_json(
    char* buffer,
    uint64_t buffer_size,
    uint64_t* required_size);
'''
          assert s.count(old) == 1
          h.write_text(s.replace(old, new, 1), encoding='utf-8')

          abi = Path('src/terra_abi.c')
          s = abi.read_text(encoding='utf-8')
          anchor = '''#include "terra_abi.h"
'''
          assert s.count(anchor) == 1
          s = s.replace(anchor, anchor + '''
extern char tx_last_error[256];
extern uint32_t tx_strlen(const char *s);
''', 1)
          tail = '''const char* terra_build_info_json(void) {
    return g_build_info_json;
}
'''
          addition = tail + '''
terrax_world_status terra_info_get_last_error_json(
    char* buffer,
    uint64_t buffer_size,
    uint64_t* required_size) {
    uint32_t len = tx_strlen(tx_last_error);
    uint64_t needed = (uint64_t)len + 1u;
    if (required_size) *required_size = needed;
    if (!buffer || buffer_size == 0u) return TERRAX_WORLD_STATUS_OK;
    if (buffer_size < needed) return TERRAX_WORLD_STATUS_BUFFER_TOO_SMALL;
    for (uint32_t i = 0u; i <= len; i++) buffer[i] = tx_last_error[i];
    return TERRAX_WORLD_STATUS_OK;
}
'''
          assert s.count(tail) == 1
          abi.write_text(s.replace(tail, addition, 1), encoding='utf-8')

          api = Path('src/terra_api.c')
          s = api.read_text(encoding='utf-8')
          old = '''terrax_world_status terra_info_get_last_error_json(
    char* buffer,
    uint64_t buffer_size,
    uint64_t* required_size) {
    return write_string_to_caller(tx_last_error, buffer, buffer_size, required_size);
}

'''
          assert s.count(old) == 1
          api.write_text(s.replace(old, '', 1), encoding='utf-8')

          exports = Path('exports.plr.txt')
          lines = exports.read_text(encoding='utf-8').splitlines()
          assert '_terra_info_get_last_error_json' not in lines
          insert_at = lines.index('_terra_build_info_json') + 1
          lines.insert(insert_at, '_terra_info_get_last_error_json')
          exports.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          # 2. Correct the JS last-error helper: the public ABI uses uint64_t*.
          t = Path('tests/test_plr.js')
          s = t.read_text(encoding='utf-8')
          old = '''function lastError(module) {
  return twoCallJson(module, module._terra_info_get_last_error_json, []);
}
'''
          new = '''function lastError(module) {
  assert.equal(typeof module._terra_info_get_last_error_json, "function",
    "structured last-error ABI must be exported by the selected feature set");
  const required = module._tx_malloc(8);
  assert(required, "last-error required-size allocation failed");
  let output = 0;
  try {
    assert.equal(module._terra_info_get_last_error_json(0, 0n, required), 0);
    const view = new DataView(module.HEAPU8.buffer);
    const size = Number(view.getBigUint64(required, true));
    assert(size > 1, "last-error JSON is empty");
    output = module._tx_malloc(size);
    assert(output, "last-error output allocation failed");
    assert.equal(module._terra_info_get_last_error_json(output, BigInt(size), required), 0);
    return JSON.parse(module.UTF8ToString(output, size));
  } finally {
    if (output) module._tx_free(output);
    module._tx_free(required);
  }
}
'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''      assert.equal(getField(module, reopened, "/voiceVariant"), version >= 280 ? 3 : 2);
'''
          new = '''      const expectedVoiceVariant = version >= 280 ? 3 :
        (version <= 17 ? ([5, 6, 9, 11].includes(model.hair) ? 2 : 1) : 2);
      assert.equal(getField(module, reopened, "/voiceVariant"), expectedVoiceVariant);
'''
          assert s.count(old) == 1
          t.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 3. Replace the stale real-fixture 327 hard-rejection contract.
          f = Path('tests/test_plr_real_fixture.js')
          s = f.read_text(encoding='utf-8')
          old = '''test("PLR rejects versions newer than Terraria's current release", async () => {
  const module = await TerraWorldWasm();
  const baseline = module._tx_heap_used();
  const model = JSON.parse(fs.readFileSync(MODEL_FIXTURE, "utf8"));
  model.version = 326;
  let handle = 0;
  try {
    handle = openJson(module, model);
    assert.equal(getField(module, handle, "/version"), 326);
    assert.equal(setField(module, handle, "/version", 327), 6,
      "release 327 must be rejected until Terraria defines that layout");
    assert.equal(getField(module, handle, "/version"), 326,
      "failed future-version edit must remain atomic");
  } finally {
    if (handle) module._terra_player_close(handle);
  }
  assert.equal(module._tx_heap_used(), baseline);
});'''
          new = '''test("real-layout PLR accepts a newer release when the persisted layout is unchanged", async () => {
  const module = await TerraWorldWasm();
  const baseline = module._tx_heap_used();
  const source = realFixtureBytes();
  let handle = 0;
  let reopened = 0;
  try {
    handle = openBuffer(module, source);
    assert.equal(getField(module, handle, "/version"), 326);
    assert.equal(setField(module, handle, "/version", 327), 0,
      "release 327 must be accepted when it still matches the latest known layout");
    const encoded = encode(module, handle, { expectCached: true });
    reopened = openBuffer(module, encoded);
    assert.equal(getField(module, reopened, "/version"), 327);
    assert.equal(getField(module, reopened, "/taxMoney"), 113750);
    assert.equal(getField(module, reopened, "/voiceVariant"), 2);
  } finally {
    if (reopened) module._terra_player_close(reopened);
    if (handle) module._terra_player_close(handle);
  }
  assert.equal(module._tx_heap_used(), baseline);
});'''
          assert s.count(old) == 1
          f.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-plr-final-contracts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: align PLR-only error ABI and future-version contracts [plr-final-contracts]"
          git push
