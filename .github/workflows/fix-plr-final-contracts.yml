name: Fix final PLR contracts

on:
  push:
    branches:
      - fix/plr-full-history-forward-compatible
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[plr-final-contracts]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Apply common error ABI and source-aligned test fixes
        run: python scripts/fix_plr_final_contracts.py
      - name: Commit fixes and remove temporary construction files
        shell: bash
        run: |
          rm scripts/fix_plr_final_contracts.py
          rm .github/workflows/fix-plr-final-contracts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: align PLR-only error ABI and future-version contracts [plr-final-contracts]"
          git push
