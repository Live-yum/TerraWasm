name: Debug PLR v326 layout

on:
  push:
    branches:
      - fix/plr-real-fixtures-and-performance
    paths:
      - .github/workflows/debug-plr-layout.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Trace v326 layout candidates
        shell: bash
        run: |
          set -euo pipefail
          KEY=6800330079005f006700550079005a00
          openssl enc -d -aes-128-cbc -K "$KEY" -iv "$KEY" -in 'tests/files/烟花.plr' -out /tmp/p.bin
          python3 - <<'PY'
          import struct
          from pathlib import Path
          d=Path('/tmp/p.bin').read_bytes(); p=0
          def need(n,l='x'):
            if p+n>len(d): raise RuntimeError(f'{l}: EOF {p}/{len(d)} need {n}')
          def u8(l='u8'):
            global p; need(1,l); v=d[p]; p+=1; return v
          def u16(l='u16'):
            global p; need(2,l); v=struct.unpack_from('<H',d,p)[0]; p+=2; return v
          def i32(l='i32'):
            global p; need(4,l); v=struct.unpack_from('<i',d,p)[0]; p+=4; return v
          def u32(l='u32'):
            global p; need(4,l); v=struct.unpack_from('<I',d,p)[0]; p+=4; return v
          def i64(l='i64'):
            global p; need(8,l); v=struct.unpack_from('<q',d,p)[0]; p+=8; return v
          def u64(l='u64'):
            global p; need(8,l); v=struct.unpack_from('<Q',d,p)[0]; p+=8; return v
          def f32(l='f32'):
            global p; need(4,l); v=struct.unpack_from('<f',d,p)[0]; p+=4; return v
          def s(l='str'):
            global p
            n=0; sh=0
            for _ in range(5):
              b=u8(l+'.len'); n|=(b&127)<<sh
              if not b&128: break
              sh+=7
            if n>1_000_000: raise RuntimeError(f'{l}: len={n} off={p}')
            need(n,l); raw=d[p:p+n]; p+=n; return raw.decode()
          version=i32(); u64(); u32(); u64(); name=s('name')
          def item(kind='full',fav=False,label='item'):
            t=i32(label+'.type')
            if kind=='equip-modern':
              pref=u8(label+'.prefix'); extra=u8(label+'.modernExtra')
              return t,0,pref,extra
            if kind=='equip':
              pref=u8(label+'.prefix'); return t,0,pref,0
            st=i32(label+'.stack'); pref=u8(label+'.prefix'); f=bool(u8(label+'.fav')) if fav else False
            return t,st,pref,f
          def arr(n,**kw): return [item(label=f'i{i}',**kw) for i in range(n)]
          def mark(l): print(l,p,hex(p),'remain',len(d)-p,'next',d[p:p+32].hex())
          difficulty=u8(); play=i64(); hair=i32(); hairdye=u8(); team=u8(); hide=(u8(),u8()); hidemisc=u8(); skin=u8(); stats=[i32() for _ in range(4)]
          legacy=[u8() for _ in range(11)]; newflag=u8('newflag'); tax=i32(); pve=i32(); pvp=i32(); colors=[tuple(u8() for _ in range(3)) for _ in range(7)]
          print('prefix',version,name,stats,legacy,newflag,tax,pve,pvp,colors); mark('prefix-end')
          armor=arr(20,kind='equip-modern'); dyes=arr(10,kind='equip-modern'); inv=arr(58,fav=True)
          misc=[]
          for i in range(5): misc.append((item(kind='equip',label=f'miscEquip{i}'),item(kind='equip',label=f'miscDye{i}')))
          pig=arr(40); safe=arr(40); forge=arr(40); vault=arr(40,fav=True); vi=u8(); buffs=[(i32(),i32()) for _ in range(44)]
          print('armorExtras',[x[3] for x in armor]); print('dyeExtras',[x[3] for x in dyes])
          print('items sample',armor[:5],dyes[:2],inv[:3],misc[:2],pig[:2],vault[:2],vi,buffs[:3]); mark('buff-end')
          sp=[]
          for _ in range(201):
            x=i32('spawn.x')
            if x==-1: break
            sp.append((x,i32(),i32(),s('spawn.name')))
          hb=u8(); hi=[u8() for _ in range(13)]; ang=i32(); dpad=[i32() for _ in range(4)]; builder=[i32() for _ in range(12)]; bart=i32(); dead=u8(); resp=i32() if dead else None; last=i64(); golfer=i32()
          print('tail-a',len(sp),sp[:2],hb,hi,ang,dpad,builder,bart,dead,resp,last,golfer); mark('tail-a-end')
          unlock=u8(); n=i32('sac-count'); print('sac-count',n)
          if not 0<=n<=4096: raise RuntimeError(f'sac count {n} off {p-4}')
          sacs=[(s('sac'),i32()) for _ in range(n)]; tf=u8(); temps=[item(label=f'temp{i}') if tf&(1<<i) else None for i in range(4)]
          powers=[]
          while u8('power.present'):
            pid=u16('power.id')
            if pid in (5,11): v=u8()
            elif pid==14: v=f32()
            else: raise RuntimeError(f'power {pid} off {p}')
            powers.append((pid,v))
          supercart=u8(); cur=i32(); print('tail-b',unlock,n,sacs[:2],tf,temps,powers,supercart,cur); mark('loadouts-start')
          loads=[]
          for li in range(3): loads.append((arr(20),arr(10),[u8() for _ in range(10)]))
          vv=u8(); vp=f32(); pn=i32('pending-count'); print('post-loadout',loads[0][0][:3],vv,vp,'pending',pn); mark('pending-start')
          if not 0<=pn<=4096: raise RuntimeError(f'pending {pn} off {p-4}')
          pending=arr(pn); dn=i32('dialog-count'); print('dialog-count',dn)
          if not 0<=dn<=4096: raise RuntimeError(f'dialog {dn} off {p-4}')
          dialogs=[s('dialog') for _ in range(dn)]
          print('end',pending[:2],dialogs[:3]); mark('EOF'); print('exact',p==len(d),p,len(d))
          PY
