name: Finalize PLR v326 compatibility

on:
  push:
    branches:
      - fix/plr-v326-compat
    paths:
      - tools/finalize_plr_v326.py
      - .github/workflows/finalize-plr-v326.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Apply reviewed follow-up fixes
        run: python3 tools/finalize_plr_v326.py
      - name: Remove temporary transform files
        run: |
          rm -f tools/finalize_plr_v326.py
          rm -f .github/workflows/finalize-plr-v326.yml
      - name: Commit reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Live-rua"
          git config user.email "105066993+Live-rua@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: lock v326 semantic field alignment"
          git push origin HEAD:fix/plr-v326-compat
