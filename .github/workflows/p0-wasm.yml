name: P0 compact WASM

on:
  push:
    branches:
      - refactor/p0-world-session-size
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p0-compact-wasm
  cancel-in-progress: false

jobs:
  build-and-test:
    if: ${{ !contains(github.event.head_commit.message || '', '[p0-wasm-report]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/p0-world-session-size
          fetch-depth: 0
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.69'
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install CMake and Ninja
        run: python3 -m pip install --user 'cmake>=3.27,<4' ninja
      - name: Build, test and measure
        id: validation
        continue-on-error: true
        run: python3 scripts/run_p0_validation.py
      - name: Commit validation report and compact engine
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports dist
          if git diff --cached --quiet; then
            echo "No report or artifact changes"
          else
            git commit -m "ci: update compact wasm artifacts [p0-wasm-report]"
            git push origin HEAD:refactor/p0-world-session-size
          fi
      - name: Upload compact web engine
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrax-web-engine
          path: |
            dist
            reports
          if-no-files-found: ignore
      - name: Fail when validation failed
        if: ${{ steps.validation.outcome == 'failure' }}
        run: exit 1
