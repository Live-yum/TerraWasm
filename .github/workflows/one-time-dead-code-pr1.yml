name: One-time TerraWasm dead-code cleanup PR1

on:
  push:
    branches:
      - cleanup/dead-code-pr1

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
          ref: cleanup/dead-code-pr1
      - name: Remove verified historical dead files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for relative in ['scripts/fix_update.py', 'scripts/fix_litmap.py']:
              path = Path(relative)
              if not path.exists():
                  raise SystemExit(f'expected historical fix script missing: {relative}')
              path.unlink()

          ops_path = Path('src/terra_ops.c')
          ops = ops_path.read_text(encoding='utf-8')
          old = ' * set_visibility and remove_all_wires are merged into batch_update_tiles.\n'
          new = (' * batch_update_tiles is the primary mutation path used by the viewer.\n'
                 ' * set_visibility and remove_all_wires remain compatibility operations\n'
                 ' * because they are still dispatched and documented by the public JSON ABI.\n')
          if old not in ops:
              raise SystemExit('expected stale operation comment not found')
          ops_path.write_text(ops.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

          test ! -e scripts/fix_update.py
          test ! -e scripts/fix_litmap.py
          grep -q 'return execute_set_visibility' src/terra_ops.c
          grep -q 'return execute_remove_all_wires' src/terra_ops.c
          grep -q 'int execute_set_visibility' src/terra_update.c
          grep -q 'int execute_remove_all_wires' src/terra_update.c

      - name: Run WLD native contracts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes zlib1g-dev
          cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release -DTERRAWASM_NATIVE_TESTS=ON -DTERRAWASM_FEATURE_SET=wld
          cmake --build build-native --config Release --parallel
          ctest --test-dir build-native --build-config Release --output-on-failure

      - name: Commit validated cleanup and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-dead-code-pr1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "cleanup: remove historical WLD repair scripts"
          git push origin HEAD:cleanup/dead-code-pr1
