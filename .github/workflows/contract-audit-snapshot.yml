name: Contract audit snapshot
on:
  push:
    branches: [audit/contract-snapshot-20260914]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 108e601e007a6075978005049f5fa07365787248
          path: current
          lfs: true
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: d1fad164b2e574f8df5760d8410a1d6ea30cd337
          path: previous
          lfs: true
          persist-credentials: false
      - name: Archive tracked source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/snapshot"
          for dir in current previous; do
            (
              cd "$dir"
              git diff --exit-code
              git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/snapshot/$dir-identity.txt"
              git ls-files -s > "$RUNNER_TEMP/snapshot/$dir-index.txt"
              git ls-files -z | tar --null --no-recursion -T - -czf "$RUNNER_TEMP/snapshot/$dir.tgz"
            )
          done
      - uses: actions/upload-artifact@v7
        with:
          name: terra-contract-audit-snapshot
          path: ${{ runner.temp }}/snapshot/
          retention-days: 1
          if-no-files-found: error
