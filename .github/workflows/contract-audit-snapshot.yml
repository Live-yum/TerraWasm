name: Contract audit tree preparation
on:
  push:
    branches: [audit/contract-snapshot-20260914]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - name: Prepare and verify reviewed source tree
        shell: bash
        run: |
          set -euo pipefail
          git read-tree --reset -u d1fad164b2e574f8df5760d8410a1d6ea30cd337
          python3 - <<'PY'
          from pathlib import Path
          def replace(file, old, new):
              p = Path(file)
              text = p.read_text()
              assert text.count(old) == 1, (file, old)
              p.write_text(text.replace(old, new))
          replace('.github/workflows/quality.yml', '      - name: Run fuzz smoke explicitly\n        run: ctest --test-dir build-sanitizer --build-config RelWithDebInfo --output-on-failure -R terra_fuzz_smoke\n', '')
          replace('.github/workflows/quality.yml', '      - name: Enforce manifest artifact sizes\n        run: node scripts/check-artifact-size.mjs build/terra.manifest.json\n', '')
          replace('.github/workflows/quality.yml', '''      - name: Build and validate viewer Web profile
                  if: matrix.features == 'wld'
                  shell: pwsh
                  run: |
                    ./build.ps1 -Target all -Features wld -ViewerWebProfile -Test -EmsdkDir "$env:RUNNER_TEMP/emsdk"
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                    & node tests/check_viewer_web_profile_artifact.js build/terrax_world_wasm_web.wasm
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ''', '''      - name: Validate buffer-only WLD Web profile
                  if: matrix.features == 'wld'
                  shell: pwsh
                  run: node tests/check_viewer_web_profile_artifact.js build/terrax_world_wasm_web.wasm
          ''')
          replace('CMakeLists.txt', 'option(TERRAWASM_VIEWER_WEB_PROFILE "Mark the WLD Web target as the viewer profile" OFF)\n', '')
          replace('CMakeLists.txt', 'if(TERRAWASM_VIEWER_WEB_PROFILE AND NOT TERRAWASM_FEATURE_SET STREQUAL "wld")\n    message(FATAL_ERROR "TERRAWASM_VIEWER_WEB_PROFILE requires TERRAWASM_FEATURE_SET=wld")\nendif()\n', '')
          replace('CMakeLists.txt', '    if(TERRAWASM_VIEWER_WEB_PROFILE)\n', '    # WLD Web is already the buffer-only viewer profile; no second build switch.\n    if(TERRAWASM_FEATURE_SET STREQUAL "wld")\n')
          replace('build.ps1', '    [switch]$EnableLto,\n    [switch]$ViewerWebProfile\n', '    [switch]$EnableLto\n')
          replace('build.ps1', '$ViewerWebProfileFlag = if ($ViewerWebProfile) { "ON" } else { "OFF" }\n', '')
          replace('build.ps1', '    TERRAWASM_VIEWER_WEB_PROFILE = $ViewerWebProfileFlag\n', '')
          replace('README.md', 'viewer-app 部署可额外使用 `-ViewerWebProfile`（仅允许与 `-Features wld` 组合）。该开关只给 Web/Mini Program target 定义 `TERRAWASM_VIEWER_WEB_PROFILE=1`，并在 build identity 中标记 viewer 专用产物；viewer 未使用的旧 WLD operation 已从所有构建中永久移除，同一次构建的 Node target 仍保持完整 WLD ABI。', '`-Features wld` 的 Web target 已经是 buffer-only profile，`viewerWebProfile` 身份字段直接由该选择推导，不再需要 `-ViewerWebProfile` 或第二次构建。该字段作为 schema v1 兼容元数据保留；Node target 仍保持完整 WLD ABI，all/plr target 不受影响。')
          replace('tests/test_feature_set.js', '  assert.equal(identity.featureSet, featureSet);\n', '  assert.equal(identity.featureSet, featureSet);\n  assert.equal(identity.viewerWebProfile, false, "Node is not a Web profile");\n  assert.equal(manifest.build.viewerWebProfile, featureSet === "wld",\n    "the compiled Web profile follows feature selection without another switch");\n')
          Path('test_thumbnail.ps1').unlink()
          PY
          git add -A
          test "$(git write-tree)" = 555d9d372c1c9fa7bfe7fe11dfa831f57e26ea75
          git config user.name 'Contract audit'
          git config user.email 'contract-audit@users.noreply.github.com'
          git commit -m 'chore(audit): materialize verified product tree'
          git push origin HEAD:refs/heads/audit/contract-snapshot-20260914
