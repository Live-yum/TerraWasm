name: Apply PLR review fixes

on:
  push:
    branches:
      - fix/plr-real-fixtures-and-performance
    paths:
      - scripts/apply_plr_review_fixes.py
      - .github/workflows/apply-plr-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - name: Apply targeted PLR fixes
        run: python3 scripts/apply_plr_review_fixes.py
      - name: Commit transformed source and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No PLR fix changes to commit"
            exit 0
          fi
          git commit -m "fix: harden PLR compatibility and two-call caching"
          git push origin HEAD:fix/plr-real-fixtures-and-performance
