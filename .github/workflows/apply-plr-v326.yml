name: Apply PLR v326 compatibility

on:
  push:
    branches:
      - fix/plr-v326-compat
    paths:
      - tools/apply_plr_v326.py
      - .github/workflows/apply-plr-v326.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Apply exact source transform
        run: python3 tools/apply_plr_v326.py
      - name: Remove temporary transformation workflows
        shell: bash
        run: |
          rm -f tools/apply_plr_v326.py
          rm -f .github/workflows/apply-plr-v326.yml
          rm -f .github/workflows/debug-plr-layout.yml
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Live-rua"
          git config user.email "105066993+Live-rua@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: support Terraria player v326 layout"
          git push origin HEAD:fix/plr-v326-compat
